name: build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Fixtures match their script
        run: npm run fixtures:check

      - name: Types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: aml-viewer-3d-web
          path: dist/web

  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the page
        run: |
          npm ci
          npm run build

      # Builds the plugin and its package, then checks the package (PackageTests):
      # no contract or Aml.Engine beside the plugin, no declared dependencies, the
      # page with its worker, the tag the editor searches for, the page for nuget.org.
      - name: Plugin tests
        run: dotnet test plugin/Aml.Editor.Plugin.Viewer3D.Tests/Aml.Editor.Plugin.Viewer3D.Tests.csproj -c Release

      # The probe needs a desktop with WebView2 to run; here it is only compiled.
      - name: Probe builds
        run: dotnet build plugin/Aml.Editor.Plugin.Viewer3D.Probe/Aml.Editor.Plugin.Viewer3D.Probe.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: Aml.Editor.Plugin.Viewer3D-nupkg
          path: plugin/build/Aml.Editor.Plugin.Viewer3D/Release/*.nupkg
          if-no-files-found: error

  release:
    # Only this job may write, and only for a version tag that matches the
    # package version.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aml.Editor.Plugin.Viewer3D-nupkg
          path: nupkg

      - name: Check that the tag matches the package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "nupkg/Aml.Editor.Plugin.Viewer3D.${version}.nupkg" || { ls nupkg; echo "no package for version ${version}"; exit 1; }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nupkg/*.nupkg
          generate_release_notes: true
          fail_on_unmatched_files: true

  nuget:
    # Publishes to nuget.org, where the AutomationML Editor finds the plugin under
    # PublicSource by its tag AMLEditorPlugin.Net. Trusted publishing: GitHub proves
    # the workflow's identity (OIDC) and nuget.org hands out a short-lived key, so no
    # API key is stored in the repository. Skipped until the repository variable
    # NUGET_USER names the nuget.org account that holds the trusted publishing policy.
    # A version on nuget.org cannot be replaced, so the environment can require an
    # approval before this job runs.
    if: startsWith(github.ref, 'refs/tags/v') && vars.NUGET_USER != ''
    needs: [build, plugin]
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aml.Editor.Plugin.Viewer3D-nupkg
          path: nupkg

      - name: Check that the tag matches the package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "nupkg/Aml.Editor.Plugin.Viewer3D.${version}.nupkg" || { ls nupkg; echo "no package for version ${version}"; exit 1; }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org account (profile name, not e-mail) that owns the trusted publishing policy.
          user: ${{ vars.NUGET_USER }}

      - name: Push the package
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
