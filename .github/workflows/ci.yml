name: build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install
        run: npm ci

      - name: Fixtures match their script
        run: npm run fixtures:check

      - name: Types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: aml-viewer-3d-web
          path: dist/web

  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the page
        run: |
          npm ci
          npm run build

      # Builds the plugin and its package, then checks the package.
      - name: Plugin tests
        run: dotnet test plugin/Aml.Editor.Plugin.Viewer3D.Tests/Aml.Editor.Plugin.Viewer3D.Tests.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: aml-viewer-3d-plugin
          path: plugin/build/Aml.Editor.Plugin.Viewer3D/Release/*.nupkg
